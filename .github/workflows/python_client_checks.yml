name: Checks on the Python client

# This workflow performs some checks on the Python client used by the ragger tests
# It is there to help us maintain a level of quality in our codebase and does not have to be kept on forked
# applications.

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:

jobs:
  lint:
    name: Client linting
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # coincurve 21.0.0 has Python 3.13 wheels, but its source build fails on 3.14.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Installing PIP dependencies
        run: |
          pip install pylint
          pip install -r tests/requirements.txt
      - name: Lint Python code
        run: pylint --rc tests/setup.cfg tests/application_client/

  mypy:
    name: Type checking
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Installing PIP dependencies
        run: |
          pip install mypy
          pip install -r tests/requirements.txt
      - name: Mypy type checking
        run: mypy tests/application_client/
