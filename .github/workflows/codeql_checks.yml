name: "CodeQL"

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    # Excluded path: add the paths you want to ignore instead of deleting the workflow
    paths-ignore:
      - '.github/workflows/*.yml'
      - 'tests/*'

permissions:
  contents: read
  actions: read
  security-events: write  # required to upload SARIF results

jobs:
  analyse:
    name: Analyse
    strategy:
      fail-fast: false
      matrix:
        sdk: ["$NANOX_SDK", "$NANOSP_SDK", "$STAX_SDK", "$FLEX_SDK"]
        # 'cpp' covers C and C++
        language: ['cpp']
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-builder-lite@sha256:687f4071ca076c92afcbb9f9540c4b21ddfc0580a3fe71d6cc1b27edab8905fd

    steps:
      - name: Clone
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      # CodeQL will create the database during the compilation
      - name: Build
        run: |
          make BOLOS_SDK=${{ matrix.sdk }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
